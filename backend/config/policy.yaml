# ---------------------------------------------------------------------------
# Expense policy used by the agent's rule engine.
# Amounts are in the base currency (see settings.yaml -> app.base_currency).
# ---------------------------------------------------------------------------

max_receipt_age_days: 90
receipt_required_above: 300
claim_requires_purpose: true
weekend_expenses: "warn"          # "allow" | "warn"
duplicate_detection:
  amount_tolerance: 1.0           # absolute difference in base currency
  date_window_days: 2
  vendor_similarity: 0.75         # 0..1 fuzzy ratio

# Fields every expense line needs before submission.
required_fields: ["vendor", "date", "total_amount", "currency", "category"]

# Words that mark an item as non-reimbursable.
blocked_keywords: ["alcohol", "liquor", "beer", "wine", "whisky", "vodka", "rum",
                   "cigarette", "tobacco", "spa", "minibar"]

fx_rates:                          # 1 unit of currency = N base currency
  INR: 1
  USD: 83.2
  EUR: 90.5
  GBP: 105.4
  AED: 22.6
  SGD: 61.8
  JPY: 0.56

# Categories appear in this order in dropdowns. On a keyword tie the earlier one wins.
# limit_per_item values are defaults - set them to your company's actual limits.
categories:
  # --- Company reimbursement heads -------------------------------------------
  - key: broadband
    label: "Broadband Reimbursement"
    icon: "📶"
    limit_per_item: 1500
    keywords: ["broadband", "fibernet", "fiber", "fibre", "jiofiber", "airfiber", "wifi", "wi-fi",
               "hathway", "excitel", "xstream", "act fibernet", "internet bill"]
  - key: children_education
    label: "Children Education Allowance"
    icon: "🎒"
    limit_per_item: 5000
    requires: ["description"]
    keywords: ["school", "school fees", "tuition", "tuition fee", "college", "education", "academy",
               "admission", "term fee", "vidyalaya", "cbse", "विद्यालय", "शुल्क", "स्कूल", "शिक्षा"]
  - key: field_incidentals
